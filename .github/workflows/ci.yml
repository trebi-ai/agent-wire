name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: [self-hosted, Linux, X64] }
          - { name: macos, os: [self-hosted, macOS, ARM64] }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: go test
        run: go test -race ./...

      - name: coverage
        if: runner.os == 'Linux'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  # Tags each module whose code changed. See scripts/tag.sh for the rules.
  tag:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      # The Actions token cannot tag a commit that changes .github/workflows.
      # The trebi-releaser App token can.
      - name: Mint a tag token
        id: app
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: "Iv23liHamBzMshOMTWIG"
          private-key: ${{ secrets.GH_APP_SECRET }}
          owner: trebi-ai
          repositories: agent-wire
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Tag changed modules
        run: scripts/tag.sh
